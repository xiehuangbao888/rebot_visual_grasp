# Wrist camera extrinsic relative to gripper_end (meters / radians).
# Tune with align_mount / align_camera, then copy values here.
# Frame chain: gripper_end -> camera_mount_link -> camera_link
# Orbbec driver publishes camera_link -> optical frames.

mount:
  parent_frame: gripper_end
  child_frame: camera_mount_link
  xyz: [-0.1201, 0.0003, 0.0507]
  rpy: [1.5827, 0.0024, 1.5515]

camera:
  parent_frame: camera_mount_link
  child_frame: camera_link
  xyz: [0.0249, 0.0487, 0.0090]
  rpy: [0.0042, -1.0502, -1.5718]
