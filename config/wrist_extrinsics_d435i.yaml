# Wrist D435i extrinsic relative to gripper_end (meters / radians).
# Keep in sync with description/urdf/rebotarm_rs_with_d435i.urdf.xacro.
# Frame chain: gripper_end -> camera_mount_link -> camera_bottom_screw_frame -> camera_link
#
# mount_* : same as Gemini2 (identical D435_Gemini2_Mount bracket). Never touch D405.
# camera_* : D435i only — tune with align_camera assembly:=d435i.

mount:
  parent_frame: gripper_end
  child_frame: camera_mount_link
  xyz: [-0.1201, 0.0003, 0.0450]
  rpy: [1.5827, 0.0024, 1.5515]

camera:
  parent_frame: camera_mount_link
  child_frame: camera_bottom_screw_frame
  xyz: [-0.0003, 0.0445, -0.0095]
  rpy: [0.0126, -1.0489, -1.5981]
